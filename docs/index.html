<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAI - AI Assistant</title>
  
  <!-- Modern Antigravity / Google AI Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Puter.js Free AI Engine (GPT-4o-mini & Claude) -->
  <script src="https://js.puter.com/v2/"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <div class="app-layout">
    
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="brand-avatar">🤖</div>
          <div class="brand-text">
            <h2>NexusAI</h2>
          </div>
        </div>
      </div>

      <div class="sidebar-action-wrap">
        <button class="new-chat-btn" id="new-chat-btn">
          <i data-lucide="plus"></i>
          <span>New Chat</span>
        </button>
      </div>

      <div class="sidebar-section-header">
        <span>Recent Chats</span>
      </div>
      <div class="chat-history-list" id="chat-history-list"></div>

      <div class="sidebar-footer">
        <button class="sidebar-btn" id="btn-open-trainer">
          <i data-lucide="book-open"></i>
          <span>FAQ Knowledge Base</span>
        </button>
        <button class="sidebar-btn" id="btn-clear-history">
          <i data-lucide="trash-2"></i>
          <span>Clear All Chats</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main Chat View -->
    <main class="main-content">
      
      <!-- Top Navbar (Clean & Minimalist) -->
      <header class="top-nav">
        <div class="nav-left">
          <button class="icon-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M9 3v18"></path>
            </svg>
          </button>
          <div class="header-brand-title">
            <span class="header-name">NexusAI</span>
          </div>
        </div>

        <div class="nav-right">
          <!-- AI Model Selector Pill -->
          <div class="model-selector-wrap">
            <select id="model-select" class="lang-select" title="AI Model Engine">
              <option value="luna">🌙 GPT-3.6 Luna (Cognitive)</option>
              <option value="auto">⚡ Nexus-4o (Ultra Smart)</option>
              <option value="claude">🧠 Claude 3.5 (Deep Logic)</option>
              <option value="coder">💻 Code Architect (1000+ Lines)</option>
              <option value="multilingual">🌐 Bhasha AI (Hindi/English)</option>
            </select>
          </div>

          <div class="lang-selector-wrap">
            <select id="lang-select" class="lang-select" title="Language">
              <option value="auto">🌐 Auto Detect</option>
              <option value="hi-IN">🇮🇳 हिन्दी (Hindi)</option>
              <option value="hinglish">🇮🇳 Hinglish</option>
              <option value="en-US">🇺🇸 English</option>
            </select>
          </div>

          <button class="icon-btn" id="btn-tts-toggle" title="Voice Output (TTS)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          
          <button class="icon-btn" id="btn-sfx-toggle" title="Sound Effects">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
          </button>

          <button class="icon-btn" id="btn-export-menu" title="Export Chat">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>

          <button class="icon-btn" id="btn-theme-toggle" title="Toggle Dark/Light Mode">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Message Canvas -->
      <div class="chat-canvas" id="chat-canvas">
        
        <!-- Clean, Minimalist Welcome Hero -->
        <div class="welcome-hero" id="welcome-hero">
          <div class="hero-avatar">
            <span class="hero-emoji">🤖</span>
          </div>

          <h2 id="greeting-text">How can I help you today?</h2>
        </div>

        <!-- Chat Messages Stream -->
        <div class="messages-container" id="messages-container"></div>
        <div id="scroll-anchor"></div>
      </div>

      <!-- Floating Minimalist Input Bar -->
      <div class="input-container-wrap">
        <div class="chat-input-card">
          <textarea 
            id="chat-textarea" 
            rows="1" 
            placeholder="Ask me anything in the universe..." 
            autocomplete="off"
            spellcheck="false"
          ></textarea>

          <div class="input-controls-right">
            <!-- Voice Mic -->
            <button class="icon-btn voice-btn" id="btn-voice-input" title="Voice Input">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>

            <!-- Send Button with Crisp Inline SVG -->
            <button class="send-round-btn" id="btn-send" title="Send message" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- FAQ Knowledge Base & Model Trainer Modal -->
  <div class="modal-overlay" id="trainer-modal">
    <div class="modal-card">
      <div class="modal-top">
        <div class="modal-title-group">
          <div class="modal-badge-icon">📚</div>
          <div>
            <h3>FAQ Knowledge Base</h3>
            <p>View questions or teach the bot new custom answers!</p>
          </div>
        </div>
        <button class="icon-btn modal-close" id="btn-close-modal"><i data-lucide="x"></i></button>
      </div>

      <div class="modal-nav-tabs">
        <button class="modal-tab active" data-tab="kb-list-view">
          <i data-lucide="list"></i> All Questions (<span id="kb-count">27</span>)
        </button>
        <button class="modal-tab" data-tab="kb-add-view">
          <i data-lucide="plus-circle"></i> Add Question
        </button>
      </div>

      <div class="modal-content-body">
        <!-- Tab 1: List -->
        <div class="tab-pane active" id="kb-list-view">
          <div class="kb-search-box">
            <i data-lucide="search"></i>
            <input type="text" id="kb-search-input" placeholder="Search questions...">
          </div>
          <div class="kb-cards-list" id="kb-cards-list"></div>
        </div>

        <!-- Tab 2: Add FAQ -->
        <div class="tab-pane" id="kb-add-view">
          <form id="teach-form" class="teach-form">
            <div class="form-row">
              <div class="form-field">
                <label>Topic / Tag:</label>
                <input type="text" id="teach-tag" placeholder="e.g. java_records" required>
              </div>
              <div class="form-field">
                <label>Category:</label>
                <input type="text" id="teach-category" placeholder="e.g. Java, AI, General" value="General" required>
              </div>
            </div>

            <div class="form-field">
              <label>User Questions (One per line):</label>
              <textarea id="teach-patterns" rows="4" placeholder="What are Java records?&#10;Explain Java records" required></textarea>
            </div>

            <div class="form-field">
              <label>Bot Answer (One per line):</label>
              <textarea id="teach-responses" rows="4" placeholder="Java Records provide a clean way to declare immutable data classes." required></textarea>
            </div>

            <div class="modal-footer-btns">
              <button type="button" class="btn btn-ghost" id="btn-cancel-teach">Cancel</button>
              <button type="submit" class="btn btn-primary-gradient">
                <i data-lucide="sparkles"></i> Save & Train
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Interactive Code Runner Sandbox Modal -->
  <div class="modal-overlay" id="preview-modal">
    <div class="modal-card" style="max-width: 900px; height: 85vh;">
      <div class="modal-top">
        <div class="modal-title-group">
          <div class="modal-badge-icon">🚀</div>
          <div>
            <h3>Live Interactive Code Runner</h3>
            <p>Real-time executable output sandbox</p>
          </div>
        </div>
        <button class="icon-btn modal-close" id="btn-close-preview"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-content-body" style="padding: 0; height: calc(100% - 65px);">
        <iframe id="preview-iframe" style="width: 100%; height: 100%; border: none; background: white;"></iframe>
      </div>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
